name: Comics
options:
  bundleIdPrefix: com.jsvana
  deploymentTarget:
    iOS: "18.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7UE4RDLUSX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Comics:
    type: application
    platform: iOS
    sources:
      - path: Comics
      - path: catalog/catalog.json
        buildPhase: resources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jsvana.comics
        INFOPLIST_FILE: Comics/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Comics/Resources/Comics.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  ComicsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ComicsTests
        excludes:
          - Fixtures
      - path: ComicsTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Comics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jsvana.comics.tests
  ComicsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ComicsUITests
    dependencies:
      - target: Comics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jsvana.comics.uitests
        TEST_TARGET_NAME: Comics
schemes:
  Comics:
    build:
      targets:
        Comics: all
        ComicsTests: [test]
        ComicsUITests: [test]
    test:
      targets:
        - ComicsTests
        - ComicsUITests
